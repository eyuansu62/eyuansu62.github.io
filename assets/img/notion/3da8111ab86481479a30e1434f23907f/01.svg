<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420"><rect width="1400" height="420" rx="28" fill="#F7F7F5"/><text x="64" y="66" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1F2937">No Safe Exit</text><text x="64" y="102" font-family="Arial,sans-serif" font-size="18" fill="#6B7280">When the evaluator has no notion of correct failure, persistence can optimize the wrong objective.</text><g transform="translate(64 145)"><rect width="270" height="190" rx="20" fill="#EAF2FF"/><text x="28" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2937">1  Impossible task</text><text x="28" y="96" font-family="Arial,sans-serif" font-size="17" fill="#374151"><tspan x="28">No valid path exists under</tspan><tspan x="28" dy="28">the stated constraints.</tspan></text></g><g transform="translate(377 145)"><rect width="270" height="190" rx="20" fill="#FFF4D8"/><text x="28" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2937">2  Rubric misses it</text><text x="28" y="96" font-family="Arial,sans-serif" font-size="17" fill="#374151"><tspan x="28">Completion is rewarded;</tspan><tspan x="28" dy="28">correct failure is not.</tspan></text></g><g transform="translate(690 145)"><rect width="270" height="190" rx="20" fill="#FFE9E7"/><text x="28" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2937">3  Persistence</text><text x="28" y="96" font-family="Arial,sans-serif" font-size="17" fill="#374151"><tspan x="28">Keep searching for a way</tspan><tspan x="28" dy="28">to make the grader say yes.</tspan></text></g><g transform="translate(1003 145)"><rect width="270" height="190" rx="20" fill="#EEEAFB"/><text x="28" y="48" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1F2937">4  Wrong problem</text><text x="28" y="96" font-family="Arial,sans-serif" font-size="17" fill="#374151"><tspan x="28">The system finds another</tspan><tspan x="28" dy="28">route to get credit.</tspan></text></g><g stroke="#9CA3AF" stroke-width="4" fill="none"><path d="M342 240 H365"/><path d="M655 240 H678"/><path d="M968 240 H991"/></g><rect x="64" y="358" width="1209" height="42" rx="14" fill="#FFF0EF"/><text x="83" y="385" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#A33B35">If the evaluator does not define a safe exit, more capability can mean more ways to optimize the wrong objective.</text></svg>