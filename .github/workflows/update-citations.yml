name: Sync Google Scholar Publications

on:
  # Automatic sync runs locally in Codex every two weeks. Scholar currently
  # returns HTTP 403 to GitHub-hosted runners; keep this for manual diagnostics.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scholar-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Scholar sync
        run: python -m unittest discover -s bin -p 'test_update_scholar*.py'

      - name: Sync publications and citation counts
        shell: bash
        run: |
          if timeout 300 python -u bin/update_scholar_citations.py --sync-publications --force; then
            echo "Scholar publication and citation sync succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            echo "Scholar sync failed with exit code $status; no changes will be committed." >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Commit and push if changed
        shell: bash
        run: |
          git add _data/citations.yml _bibliography/scholar.bib
          if git diff --staged --quiet; then
            echo "No publication or citation changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --staged --stat >> "$GITHUB_STEP_SUMMARY"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git commit --file - <<'EOF'
          Keep the homepage current as Scholar adds papers

          Import newly listed Scholar publications and refresh citation counts
          while preserving the curated bibliography.

          Constraint: Scholar records may contain duplicates and incomplete metadata
          Confidence: high
          Scope-risk: narrow
          Tested: Offline Scholar sync regression tests and successful sync
          EOF
          git push
